<title>Solmar Heat — an open-world driving game</title>

</style>

<canvas id="game" aria-label="Solmar Heat: an open-world crime game. Walk and drive around the city of Solmar, take jobs from Dario at Café Sol, steal cars, run from the police, and finish all six jobs."></canvas>
<p id="status" role="status" aria-live="polite"></p>
